# release-please for mql5-sample-lib (delivery-overhaul P5, 2026-08-09).
#
# Manifest mode, seeded at the TMKR_SDK_VERSION floor (1.3.1) that P3's
# sdk-version-consistency gate established: the manifest carries 1.3.1 and
# bootstrap-sha points at the commit that bumped the SDK submodule to v1.3.1,
# so the first release PR proposes the next patch from the conventional
# commits since then. Tags are plain `vX.Y.Z` (include-component-in-tag off).
#
# The wrapper repo's version ladder CONTINUES from the SDK #define but may run
# ahead of it on wrapper-only fixes — tag ↔ TMKR_SDK_VERSION equality is
# deliberately not enforced (same stance as ci.yml's consistency gate, which
# checks #define ↔ CLAUDE.md only). Merging a release PR is a deliberate act.
#
# Bot identity (mql-lane-followups P14, decision D-07): release-please runs with an
# installation token for the org-owned `themarketrobo-bots` GitHub App. PRs opened
# with the default GITHUB_TOKEN raised no `pull_request` runs, so the release PR's
# required checks sat "expected" until someone closed and reopened it (PR #12). The
# App's PRs raise normal runs. Its tags and Releases now raise events too; no
# workflow in this repo listens for them (checked in P14).

name: release-please

on:
  push:
    branches: [main]

# ci-cd-hardening P13 (zizmor `excessive-permissions`, High ×2). The write scopes below
# used to sit HERE, at workflow level, where every future job in this file would inherit
# them. This workflow's token can create tags and releases and open PRs; a job added
# later for an unrelated reason must not silently get that. Default-deny at the top,
# grant on the one job that needs it, with the reason on the line.
permissions:
  contents: read

# A second push landing while release-please is mid-run would race it for the same
# release branch. Serialize, and do NOT cancel in progress: a half-created release PR is
# worse than a queued one (zizmor `concurrency-limits`).
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please (manifest mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read         # every write (tags, Releases, the release PR) uses the App token below
    steps:
      # The bot identity (mql-lane-followups P14, D-07): an installation token for the
      # org-owned `themarketrobo-bots` GitHub App, minted per run and scoped to this
      # repository. No fallback to GITHUB_TOKEN: a missing or revoked key must fail the
      # run loudly instead of opening a release PR that silently has no checks.
      - name: Mint the bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # SHA-pinned (ledger N-12): a tag is a moveable pointer and this step runs with
      # `contents: write`, so `@v5` means a third-party maintainer — or anyone who
      # compromises them — can change what runs against this repo's write token without
      # a commit here. The trailing comment keeps Dependabot bumping it.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
