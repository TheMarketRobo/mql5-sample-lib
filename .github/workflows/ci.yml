# CI for mql5-sample-lib (delivery-overhaul P3, 2026-08-09 — this repo had ZERO CI before).
#
# The SDK's actual sources live in the nested PUBLIC submodule Include/themarketrobo
# (TheMarketRobo/sdk-mql5-lib), pinned by gitlink; this wrapper repo carries the samples, docs and
# the pin. Five substantive jobs + the aggregation context:
#   sdk-version-consistency — the SDK's version identity across the FOUR assertion sites reachable
#                             from this repo: the #define in Core/CSDKConstants.mqh (read at the
#                             PINNED submodule sha), the "Current SDK version: **vX.Y.Z**" claim in
#                             CLAUDE.md, .release-please-manifest.json, and the newest published tag
#                             in the SDK submodule. (Sites 5 and 6 of the audit's six live in the
#                             private aws/ repo and are documented, not checked — see
#                             SDK_RELEASE_PENDING.md.)
#   sdk-tls-flags           — the indicator transport may not waive TLS hostname/expiry validation.
#   secret-defaults         — no credential-shaped input or profile value ships a non-empty default
#                             in this PUBLIC repo.
#   mql4-support-claim      — README's platform claims match the declared compile-verification state.
#   commitlint              — conventional-commit gate (PR range; pushed head otherwise).
#
# The four substantive gates are implemented ONCE, in tools/gate-*.sh, and called by both this
# workflow and tools/verify-local.sh. Do not inline gate logic here: the previous shape kept the
# version check's sed/grep in two places, which is how a local mirror comes to disagree with CI.
#
# Design rules carried from delivery-overhaul P1 (the "gates that could not fail" ledger): no
# paths filter, no step-level `if:` skips, and required-checks asserts each
# needs.*.result == 'success'.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-version-consistency:
    name: TMKR_SDK_VERSION consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (with the nested public SDK submodule, full history for tags)
        uses: actions/checkout@v7
        with:
          submodules: true
          # fetch-depth: 0 — the gate reads the newest TAG in the SDK submodule as one
          # of its four assertion sites, and a shallow checkout has no tags to read.
          fetch-depth: 0

      - name: Fetch SDK submodule tags
        # The submodule is public and actions/checkout rewrites its URL to an
        # authenticated HTTPS one, so this needs no extra credential. The gate itself
        # retries this once and FAILS if no tag is visible — "could not check" must
        # never read as "checked and fine".
        run: git -C Include/themarketrobo fetch --tags --force origin

      - name: Version identity across the four in-repo assertion sites
        run: bash tools/gate-sdk-version-consistency.sh

  sdk-tls-flags:
    name: TLS validation enforced (SDK-1 / MQL-1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (with the nested public SDK submodule)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: No unguarded IGNORE_CERT; the debug guard is never defined
        run: bash tools/gate-sdk-tls-flags.sh

  secret-defaults:
    name: No credential ships as a default (SDK-5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Credential-shaped inputs and profile values must be empty
        run: bash tools/gate-secret-defaults.sh

  mql4-support-claim:
    name: README platform claims are backed (SDK-12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: README ↔ COMPILE_VERIFICATION.md
        run: bash tools/gate-mql4-support-claim.sh

  commitlint:
    name: commitlint (conventional commits)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history — range lint)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lint commit messages
        # Installed into the WORKSPACE (not an npx -p sandbox): commitlint resolves `-x` extends
        # from the process cwd, so a sandbox-only install dies with MODULE_NOT_FOUND (proven by
        # this workflow's own first run).
        run: |
          set -u
          npm install --no-save --no-audit --no-fund --loglevel=error \
            @commitlint/cli@19 @commitlint/config-conventional@19
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --no-install commitlint -x @commitlint/config-conventional \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx --no-install commitlint -x @commitlint/config-conventional --last --verbose
          fi

  required-checks:
    # The single context the branch ruleset requires. It `needs:` every real job and asserts each
    # actually SUCCEEDED — `needs:` alone is satisfied by a skipped dependency under
    # `if: always()`, which is how a green-but-vacuous run happens (delivery-overhaul P1 defect #4).
    name: required-checks
    if: always()
    needs: [sdk-version-consistency, sdk-tls-flags, secret-defaults, mql4-support-claim, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every gate succeeded
        run: |
          set -u
          fail=0
          for pair in "sdk-version-consistency:${{ needs.sdk-version-consistency.result }}" \
                      "sdk-tls-flags:${{ needs.sdk-tls-flags.result }}" \
                      "secret-defaults:${{ needs.secret-defaults.result }}" \
                      "mql4-support-claim:${{ needs.mql4-support-claim.result }}" \
                      "commitlint:${{ needs.commitlint.result }}"; do
            job="${pair%%:*}"; res="${pair##*:}"
            printf '  %-24s %s\n' "$job" "$res"
            [ "$res" = "success" ] || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error title=required-checks failed::At least one gate did not SUCCEED (a skipped or cancelled job counts as a failure here — that is the whole point of this job)."
            exit 1
          fi
          echo "All gates succeeded."
